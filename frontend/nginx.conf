server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large PDF uploads
    client_max_body_size 200M;

    # Strip the Coolify subpath prefix before serving static files
    location /extract-appraise/frontend/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
